<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayo Nevos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050508;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        /* Iluminación del cielo al caer el rayo */
        .sky-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: radial-gradient(ellipse at 50% 0%, rgba(255, 20, 20, 0.15) 0%, transparent 70%);
            opacity: 0;
            animation: skyFlash 1.5s ease-out forwards,
                       fadeOutSky 2s ease-in forwards 4s;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes skyFlash {
            0% { opacity: 0; }
            30% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        @keyframes fadeOutSky {
            to { opacity: 0; }
        }

        /* Rayo principal SVG */
        .lightning-container {
            position: relative;
            z-index: 2;
            margin-top: -50px;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.9))
                    drop-shadow(0 0 30px rgba(255, 30, 30, 0.6))
                    drop-shadow(0 0 60px rgba(255, 50, 50, 0.3));
        }

        .lightning-svg {
            width: 300px;
            height: 85vh;
            overflow: visible;
        }

        .lightning-path {
            fill: none;
            stroke: #ff1a1a;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;
            animation: drawLightning 1.5s ease-out forwards,
                       fadeOutLightning 2s ease-in forwards 4s;
        }

        .lightning-core {
            fill: none;
            stroke: #ff6666;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;
            animation: drawLightning 1.5s ease-out forwards,
                       fadeOutLightning 2s ease-in forwards 4s;
        }

        @keyframes drawLightning {
            to { stroke-dashoffset: 0; }
        }

        @keyframes fadeOutLightning {
            from {
                opacity: 1;
                filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.9));
            }
            to {
                opacity: 0;
                filter: drop-shadow(0 0 0px rgba(255, 0, 0, 0));
            }
        }

        /* Impacto en el suelo */
        .ground-impact {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 20px;
            background: radial-gradient(ellipse, rgba(255, 0, 0, 0.6) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            z-index: 2;
            animation: showImpact 0.3s ease-out forwards 1.2s,
                       fadeOutLightning 2s ease-in forwards 4s;
        }

        @keyframes showImpact {
            from { opacity: 0; transform: translateX(-50%) scale(0.5); }
            to { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        /* Texto NEVOS - Debajo del todo */
        .text-nevos {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            color: #ff1a1a;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.8),
                         0 0 30px rgba(255, 0, 0, 0.5),
                         0 0 60px rgba(255, 0, 0, 0.3);
            opacity: 0;
            z-index: 3;
            animation: showText 0.5s ease-out forwards 1.3s,
                       fadeOutText 2s ease-in forwards 4s;
        }

        @keyframes showText {
            from {
                opacity: 0;
                transform: translateX(-50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        @keyframes fadeOutText {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Contenedor de chispas */
        .sparks-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        .spark {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff0000, 0 0 16px #ff4444;
            opacity: 0;
        }

        /* Chispas más lentas */
        @keyframes sparkFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* Electricidad alrededor */
        .electricity-container {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .electric-arc {
            stroke: #ff4444;
            stroke-width: 2;
            fill: none;
            opacity: 0;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.9));
        }

        @keyframes electricPulse {
            0%, 100% { opacity: 0; stroke-dashoffset: 100; }
            50% { opacity: 0.8; stroke-dashoffset: 0; }
        }

        /* Indicación de reinicio */
        .hint {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: #333;
            font-size: 0.8rem;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Iluminación del cielo -->
        <div class="sky-flash"></div>

        <!-- Rayo principal -->
        <div class="lightning-container">
            <svg class="lightning-svg" viewBox="0 0 300 700" xmlns="http://www.w3.org/2000/svg">
                <!-- Brillo exterior -->
                <path class="lightning-path" d="
                    M 150 0
                    L 145 60
                    L 155 90
                    L 140 150
                    L 160 180
                    L 135 250
                    L 165 280
                    L 130 360
                    L 170 390
                    L 125 480
                    L 175 510
                    L 140 600
                    L 160 650
                    L 150 700
                "/>
                <!-- Núcleo brillante interior -->
                <path class="lightning-core" d="
                    M 150 0
                    L 147 60
                    L 153 90
                    L 143 150
                    L 157 180
                    L 138 250
                    L 162 280
                    L 133 360
                    L 167 390
                    L 128 480
                    L 172 510
                    L 138 600
                    L 158 650
                    L 150 700
                "/>
                <!-- Ramas izquierdas -->
                <path class="lightning-path" d="
                    M 145 60
                    L 100 100
                    L 80 130
                " style="animation-delay: 0.2s, 4s; stroke-width: 3;"/>
                <path class="lightning-path" d="
                    M 135 250
                    L 80 300
                    L 60 340
                " style="animation-delay: 0.5s, 4s; stroke-width: 3;"/>
                <path class="lightning-path" d="
                    M 125 480
                    L 70 540
                    L 50 580
                " style="animation-delay: 0.9s, 4s; stroke-width: 3;"/>
                <!-- Ramas derechas -->
                <path class="lightning-path" d="
                    M 155 90
                    L 200 130
                    L 230 160
                " style="animation-delay: 0.3s, 4s; stroke-width: 3;"/>
                <path class="lightning-path" d="
                    M 165 280
                    L 220 330
                    L 250 370
                " style="animation-delay: 0.7s, 4s; stroke-width: 3;"/>
                <path class="lightning-path" d="
                    M 175 510
                    L 230 570
                    L 260 610
                " style="animation-delay: 1.1s, 4s; stroke-width: 3;"/>
            </svg>
        </div>

        <!-- Impacto en el suelo -->
        <div class="ground-impact"></div>

        <!-- Texto NEVOS debajo -->
        <div class="text-nevos">NEVOS</div>

        <!-- Chispas -->
        <div class="sparks-container" id="sparksContainer"></div>

        <!-- Electricidad SVG -->
        <svg class="electricity-container" viewBox="0 0 400 700" id="electricitySvg">
        </svg>

        <div class="hint">Haz clic para reiniciar</div>
    </div>

    <script>
        const sparksContainer = document.getElementById('sparksContainer');
        const electricitySvg = document.getElementById('electricitySvg');
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        // Puntos del rayo aproximados (relativos al centro)
        const lightningPoints = [
            {x: 0, y: -300}, {x: -5, y: -240}, {x: 5, y: -210},
            {x: -10, y: -150}, {x: 10, y: -120}, {x: -15, y: -50},
            {x: 15, y: -20}, {x: -20, y: 60}, {x: 20, y: 90},
            {x: -25, y: 180}, {x: 25, y: 210}, {x: -10, y: 300}, {x: 0, y: 320}
        ];

        // Generar chispas MÁS LENTAS
        function createSpark(x, y) {
            const spark = document.createElement('div');
            spark.className = 'spark';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = 60 + Math.random() * 180;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            
            spark.style.left = x + 'px';
            spark.style.top = y + 'px';
            spark.style.setProperty('--tx', tx + 'px');
            spark.style.setProperty('--ty', ty + 'px');
            
            // Duración aumentada: de 0.3-0.8s a 0.8-2.0s para que sean más lentas
            const duration = 0.8 + Math.random() * 1.2;
            spark.style.animation = `sparkFly ${duration}s ease-out forwards`;
            
            const colors = ['#ff0000', '#ff3333', '#ff6600', '#ff8844', '#ff2222', '#ffaaaa'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            spark.style.background = color;
            spark.style.boxShadow = `0 0 ${6 + Math.random() * 10}px ${color}`;
            
            // Algunas chispas más grandes
            if (Math.random() > 0.7) {
                spark.style.width = '6px';
                spark.style.height = '6px';
            }
            
            sparksContainer.appendChild(spark);
            setTimeout(() => spark.remove(), duration * 1000 + 100);
        }

        // Generar arcos eléctricos
        function createElectricArc() {
            const arc = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            
            const startX = 200 + (Math.random() - 0.5) * 80;
            const startY = 100 + Math.random() * 500;
            const cpx = startX + (Math.random() - 0.5) * 250;
            const cpy = startY + (Math.random() - 0.5) * 250;
            const endX = startX + (Math.random() - 0.5) * 350;
            const endY = startY + (Math.random() - 0.5) * 350;
            
            arc.setAttribute('d', `M ${startX} ${startY} Q ${cpx} ${cpy} ${endX} ${endY}`);
            arc.setAttribute('class', 'electric-arc');
            arc.style.strokeDasharray = '100';
            arc.style.strokeDashoffset = '100';
            arc.style.animation = `electricPulse ${0.15 + Math.random() * 0.25}s ease-in-out`;
            
            electricitySvg.appendChild(arc);
            setTimeout(() => arc.remove(), 600);
        }

        // Control de tiempo
        let startTime = Date.now();
        let sparkInterval = null;
        let arcInterval = null;

        function checkTime() {
            const elapsed = (Date.now() - startTime) / 1000;

            // Fase de chispas: 2.0s - 4.0s
            if (elapsed >= 2.0 && elapsed < 4.0) {
                if (!sparkInterval) {
                    sparkInterval = setInterval(() => {
                        for (let i = 0; i < 4; i++) {
                            const point = lightningPoints[Math.floor(Math.random() * lightningPoints.length)];
                            createSpark(
                                window.innerWidth / 2 + point.x + (Math.random() - 0.5) * 30,
                                window.innerHeight / 2 + point.y + (Math.random() - 0.5) * 30
                            );
                        }
                    }, 120); // Intervalo más espaciado para no saturar
                }
                if (!arcInterval) {
                    arcInterval = setInterval(() => {
                        for (let i = 0; i < 2; i++) {
                            createElectricArc();
                        }
                    }, 150);
                }
            }

            if (elapsed >= 6.5) {
                if (sparkInterval) clearInterval(sparkInterval);
                if (arcInterval) clearInterval(arcInterval);
                return;
            }

            requestAnimationFrame(checkTime);
        }

        requestAnimationFrame(checkTime);

        // Reiniciar al hacer clic
        document.body.addEventListener('click', () => {
            location.reload();
        });
    </script>
</body>
</html>
