<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayo Nevos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #020205;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .scene {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cielo arriba */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: radial-gradient(ellipse at 50% 20%, rgba(80, 0, 0, 0.25) 0%, transparent 70%);
            opacity: 0;
            animation: skyFlash 1.5s ease-out forwards,
                       fadeOut 2s ease-in forwards 4s;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes skyFlash {
            0% { opacity: 0; }
            20% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Contenedor del rayo */
        .bolt-wrapper {
            position: relative;
            width: 100%;
            height: 65%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 0;
            z-index: 2;
        }

        .bolt-svg {
            width: 100%;
            height: 100%;
            max-width: 350px;
            overflow: visible;
            filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.9))
                    drop-shadow(0 0 30px rgba(255, 30, 30, 0.5));
        }

        .bolt-main {
            fill: none;
            stroke: #ff1a1a;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1500;
            stroke-dashoffset: 1500;
            animation: drawBolt 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards,
                       fadeOut 2s ease-in forwards 4s;
        }

        .bolt-glow {
            fill: none;
            stroke: #ff5555;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1500;
            stroke-dashoffset: 1500;
            animation: drawBolt 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards,
                       fadeOut 2s ease-in forwards 4s;
        }

        .branch {
            fill: none;
            stroke: #ff2222;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
            animation: drawBolt 0.8s ease-out forwards var(--delay),
                       fadeOut 2s ease-in forwards 4s;
        }

        @keyframes drawBolt { to { stroke-dashoffset: 0; } }
        @keyframes fadeOut { to { opacity: 0; } }

        /* Impacto en el suelo */
        .crater {
            position: absolute;
            bottom: 35%;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 15px;
            background: radial-gradient(ellipse, rgba(255, 40, 40, 0.7) 0%, transparent 75%);
            border-radius: 50%;
            opacity: 0;
            z-index: 2;
            animation: showCrater 0.4s ease-out forwards 1.3s,
                       fadeOut 2s ease-in forwards 4s;
        }

        @keyframes showCrater {
            from { opacity: 0; transform: translateX(-50%) scale(0.3); }
            to { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        /* Chispas - MÁS LENTAS */
        .sparks-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .spark {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            opacity: 0;
        }

        @keyframes sparkSlow {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            70% {
                opacity: 0.6;
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0.2);
            }
        }

        /* Electricidad lateral */
        .arc-svg {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 65%;
            pointer-events: none;
            z-index: 3;
            overflow: visible;
        }

        .arc-path {
            fill: none;
            stroke: #ff3333;
            stroke-width: 1.5;
            opacity: 0;
            filter: drop-shadow(0 0 6px rgba(255, 0, 0, 0.8));
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
        }

        @keyframes arcFlicker {
            0% { opacity: 0; stroke-dashoffset: 200; }
            50% { opacity: 0.9; stroke-dashoffset: 0; }
            100% { opacity: 0; stroke-dashoffset: -200; }
        }

        /* TEXTO NEVOS - ABAJO DEL TODO */
        .nevos-text {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            color: #ff1a1a;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 14px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.9),
                         0 0 50px rgba(255, 0, 0, 0.4);
            opacity: 0;
            z-index: 10;
            animation: textUp 0.6s ease-out forwards 1.4s,
                       fadeOut 2s ease-in forwards 4s;
        }

        @keyframes textUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        .hint {
            position: absolute;
            bottom: 2%;
            right: 5%;
            color: #222;
            font-size: 0.75rem;
            z-index: 20;
        }
    </style>
</head>
<body>

<div class="scene" id="scene">
    <div class="sky"></div>

    <div class="bolt-wrapper">
        <svg class="bolt-svg" viewBox="0 0 350 650" preserveAspectRatio="xMidYMin slice">
            <!-- Rayo exterior -->
            <path class="bolt-main" d="
                M 175 0
                L 170 70
                L 180 110
                L 165 180
                L 185 220
                L 160 300
                L 190 340
                L 155 430
                L 195 470
                L 170 560
                L 185 610
                L 175 650
            "/>
            <!-- Núcleo brillante -->
            <path class="bolt-glow" d="
                M 175 0
                L 172 70
                L 178 110
                L 168 180
                L 182 220
                L 163 300
                L 187 340
                L 158 430
                L 192 470
                L 173 560
                L 182 610
                L 175 650
            "/>
            <!-- Ramas -->
            <path class="branch" style="--delay: 0.3s" d="M 170 70 L 120 120 L 90 150"/>
            <path class="branch" style="--delay: 0.5s" d="M 185 220 L 240 260 L 270 290"/>
            <path class="branch" style="--delay: 0.7s" d="M 160 300 L 100 360 L 70 400"/>
            <path class="branch" style="--delay: 0.9s" d="M 195 470 L 260 520 L 290 560"/>
            <path class="branch" style="--delay: 1.1s" d="M 170 560 L 120 620 L 100 650"/>
        </svg>
    </div>

    <div class="crater"></div>

    <svg class="arc-svg" viewBox="0 0 500 650" id="arcSvg"></svg>
    <div class="sparks-layer" id="sparksLayer"></div>

    <div class="nevos-text">NEVOS</div>
    <div class="hint">clic para reiniciar</div>
</div>

<script>
    const sparksLayer = document.getElementById('sparksLayer');
    const arcSvg = document.getElementById('arcSvg');
    const scene = document.getElementById('scene');

    // Puntos del rayo para chispas (coordenadas relativas al centro de la escena)
    const sparkOrigins = [
        {x: 0, y: 70}, {x: 0, y: 180}, {x: 0, y: 300},
        {x: 0, y: 430}, {x: 0, y: 560}, {x: -40, y: 120},
        {x: 45, y: 260}, {x: -50, y: 360}, {x: 50, y: 520}
    ];

    function makeSpark() {
        const el = document.createElement('div');
        el.className = 'spark';

        const origin = sparkOrigins[Math.floor(Math.random() * sparkOrigins.length)];
        const rect = scene.getBoundingClientRect();
        const cx = rect.width / 2 + origin.x;
        const cy = rect.height * 0.35 + origin.y; // 35% es donde empieza el rayo

        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 140;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;

        const colors = ['#ff0000', '#ff3333', '#ff6600', '#ff8844', '#ffaaaa', '#ff2200'];
        const color = colors[Math.floor(Math.random() * colors.length)];

        el.style.left = cx + 'px';
        el.style.top = cy + 'px';
        el.style.background = color;
        el.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
        el.style.setProperty('--tx', `${tx}px`);
        el.style.setProperty('--ty', `${ty}px`);

        // CHISPAS LENTAS: entre 1.0 y 2.2 segundos
        const duration = 1.0 + Math.random() * 1.2;
        el.style.animation = `sparkSlow ${duration}s ease-out forwards`;

        // Algunas más grandes
        if (Math.random() > 0.6) {
            el.style.width = '7px';
            el.style.height = '7px';
        }

        sparksLayer.appendChild(el);
        setTimeout(() => el.remove(), duration * 1000 + 50);
    }

    function makeArc() {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const sx = 250 + (Math.random() - 0.5) * 60;
        const sy = 50 + Math.random() * 500;
        const qx = sx + (Math.random() - 0.5) * 300;
        const qy = sy + (Math.random() - 0.5) * 300;
        const ex = sx + (Math.random() - 0.5) * 400;
        const ey = sy + (Math.random() - 0.5) * 400;

        path.setAttribute('d', `M ${sx} ${sy} Q ${qx} ${qy} ${ex} ${ey}`);
        path.setAttribute('class', 'arc-path');
        path.style.animation = `arcFlicker ${0.2 + Math.random() * 0.3}s ease-in-out`;
        arcSvg.appendChild(path);
        setTimeout(() => path.remove(), 600);
    }

    let start = Date.now();
    let sparkTimer = null;
    let arcTimer = null;

    function loop() {
        const t = (Date.now() - start) / 1000;

        if (t >= 2.0 && t < 4.0) {
            if (!sparkTimer) {
                sparkTimer = setInterval(() => {
                    for (let i = 0; i < 3; i++) makeSpark();
                }, 180); // Más espaciado = menos caótico
            }
            if (!arcTimer) {
                arcTimer = setInterval(() => {
                    for (let i = 0; i < 2; i++) makeArc();
                }, 200);
            }
        }

        if (t < 6.5) requestAnimationFrame(loop);
        else {
            clearInterval(sparkTimer);
            clearInterval(arcTimer);
        }
    }

    requestAnimationFrame(loop);

    document.body.addEventListener('click', () => location.reload());
</script>

</body>
</html>
