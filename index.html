<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayo Nevos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Rayo principal SVG */
        .lightning-container {
            position: relative;
            z-index: 2;
        }

        .lightning-svg {
            width: 400px;
            height: 500px;
            filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.8))
                    drop-shadow(0 0 40px rgba(255, 0, 0, 0.5))
                    drop-shadow(0 0 80px rgba(255, 0, 0, 0.3));
        }

        .lightning-path {
            fill: none;
            stroke: #ff1a1a;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLightning 1.5s ease-out forwards,
                       fadeOutLightning 2s ease-in forwards 4s;
        }

        @keyframes drawLightning {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fadeOutLightning {
            from {
                opacity: 1;
                filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.8));
            }
            to {
                opacity: 0;
                filter: drop-shadow(0 0 0px rgba(255, 0, 0, 0));
            }
        }

        /* Texto NEVOS */
        .text-nevos {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff1a1a;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8),
                         0 0 40px rgba(255, 0, 0, 0.5),
                         0 0 80px rgba(255, 0, 0, 0.3);
            opacity: 0;
            z-index: 3;
            animation: showText 0.5s ease-out forwards 1.2s,
                       fadeOutText 2s ease-in forwards 4s;
        }

        @keyframes showText {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes fadeOutText {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        /* Contenedor de chispas */
        .sparks-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        .spark {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ff4444;
            border-radius: 50%;
            box-shadow: 0 0 6px #ff0000, 0 0 12px #ff4444;
            opacity: 0;
        }

        @keyframes sparkFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* Electricidad alrededor del rayo */
        .electricity-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 600px;
            pointer-events: none;
            z-index: 1;
        }

        .electric-arc {
            position: absolute;
            stroke: #ff3333;
            stroke-width: 2;
            fill: none;
            opacity: 0;
            filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.9));
        }

        @keyframes electricPulse {
            0%, 100% {
                opacity: 0;
                stroke-dashoffset: 100;
            }
            50% {
                opacity: 1;
                stroke-dashoffset: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Rayo principal -->
        <div class="lightning-container">
            <svg class="lightning-svg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
                <!-- Rayo principal con zig-zag -->
                <path class="lightning-path" d="
                    M 200 20
                    L 190 80
                    L 210 100
                    L 180 140
                    L 220 160
                    L 170 220
                    L 230 240
                    L 160 300
                    L 240 320
                    L 150 380
                    L 250 400
                    L 200 480
                "/>
                <!-- Ramas secundarias del rayo -->
                <path class="lightning-path" d="
                    M 190 80
                    L 140 120
                    L 120 140
                " style="animation-delay: 0.3s, 4s; stroke-width: 2;"/>
                <path class="lightning-path" d="
                    M 220 160
                    L 280 180
                    L 300 200
                " style="animation-delay: 0.6s, 4s; stroke-width: 2;"/>
                <path class="lightning-path" d="
                    M 170 220
                    L 120 260
                    L 100 280
                " style="animation-delay: 0.9s, 4s; stroke-width: 2;"/>
                <path class="lightning-path" d="
                    M 230 240
                    L 290 280
                    L 310 300
                " style="animation-delay: 1.1s, 4s; stroke-width: 2;"/>
            </svg>
        </div>

        <!-- Texto NEVOS -->
        <div class="text-nevos">NEVOS</div>

        <!-- Chispas -->
        <div class="sparks-container" id="sparksContainer"></div>

        <!-- Electricidad SVG -->
        <svg class="electricity-container" viewBox="0 0 500 600" id="electricitySvg">
        </svg>
    </div>

    <script>
        const sparksContainer = document.getElementById('sparksContainer');
        const electricitySvg = document.getElementById('electricitySvg');
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        // Puntos aproximados del rayo para generar chispas
        const lightningPoints = [
            {x: 0, y: -200}, {x: -10, y: -140}, {x: 10, y: -120},
            {x: -20, y: -80}, {x: 20, y: -60}, {x: -30, y: 0},
            {x: 30, y: 20}, {x: -40, y: 80}, {x: 40, y: 100},
            {x: -50, y: 160}, {x: 50, y: 180}, {x: 0, y: 240}
        ];

        // Generar chispas
        function createSpark(x, y) {
            const spark = document.createElement('div');
            spark.className = 'spark';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = 50 + Math.random() * 150;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            
            spark.style.left = x + 'px';
            spark.style.top = y + 'px';
            spark.style.setProperty('--tx', tx + 'px');
            spark.style.setProperty('--ty', ty + 'px');
            spark.style.animation = `sparkFly ${0.3 + Math.random() * 0.5}s ease-out forwards`;
            
            // Color aleatorio entre rojo, naranja y amarillo
            const colors = ['#ff0000', '#ff4444', '#ff8800', '#ffaa00', '#ff2222'];
            spark.style.background = colors[Math.floor(Math.random() * colors.length)];
            spark.style.boxShadow = `0 0 ${4 + Math.random() * 8}px ${spark.style.background}`;
            
            sparksContainer.appendChild(spark);
            
            setTimeout(() => spark.remove(), 1000);
        }

        // Generar arcos eléctricos SVG
        function createElectricArc() {
            const arc = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            
            const startX = 250 + (Math.random() - 0.5) * 100;
            const startY = 300 + (Math.random() - 0.5) * 300;
            const cp1x = startX + (Math.random() - 0.5) * 200;
            const cp1y = startY + (Math.random() - 0.5) * 200;
            const endX = startX + (Math.random() - 0.5) * 300;
            const endY = startY + (Math.random() - 0.5) * 300;
            
            arc.setAttribute('d', `M ${startX} ${startY} Q ${cp1x} ${cp1y} ${endX} ${endY}`);
            arc.setAttribute('class', 'electric-arc');
            arc.style.strokeDasharray = '100';
            arc.style.strokeDashoffset = '100';
            arc.style.animation = `electricPulse ${0.1 + Math.random() * 0.2}s ease-in-out`;
            
            electricitySvg.appendChild(arc);
            
            setTimeout(() => arc.remove(), 500);
        }

        // Control de tiempo de la animación
        let startTime = Date.now();
        let sparkInterval = null;
        let arcInterval = null;

        function checkTime() {
            const elapsed = (Date.now() - startTime) / 1000;

            // Fase de chispas: 2.0s - 4.0s
            if (elapsed >= 2.0 && elapsed < 4.0) {
                if (!sparkInterval) {
                    sparkInterval = setInterval(() => {
                        // Crear múltiples chispas por ciclo
                        for (let i = 0; i < 5; i++) {
                            const point = lightningPoints[Math.floor(Math.random() * lightningPoints.length)];
                            createSpark(
                                window.innerWidth / 2 + point.x + (Math.random() - 0.5) * 40,
                                window.innerHeight / 2 + point.y + (Math.random() - 0.5) * 40
                            );
                        }
                    }, 50);
                }
                if (!arcInterval) {
                    arcInterval = setInterval(() => {
                        for (let i = 0; i < 3; i++) {
                            createElectricArc();
                        }
                    }, 80);
                }
            }

            // Fin de la animación
            if (elapsed >= 6.5) {
                if (sparkInterval) clearInterval(sparkInterval);
                if (arcInterval) clearInterval(arcInterval);
                return;
            }

            requestAnimationFrame(checkTime);
        }

        // Iniciar el control de tiempo
        requestAnimationFrame(checkTime);

        // Reiniciar al hacer clic
        document.body.addEventListener('click', () => {
            location.reload();
        });
    </script>
</body>
</html>
